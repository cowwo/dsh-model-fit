name: Deprecate version

# 手动弃用一个已发布版本（npm 收不回版本，只能标记废弃）。
# 两个包要分别执行：npm 眼里 dsh-model-fit 和 @cowwo/dsh-model-fit 是两个独立包。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 要弃用的版本号（例如 0.2.1）
        required: true
        type: string
      message:
        description: 弃用提示（会显示给安装者）
        required: true
        type: string

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Deprecate dsh-model-fit
        run: npm deprecate "dsh-model-fit@${{ inputs.version }}" "${{ inputs.message }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deprecate @cowwo/dsh-model-fit
        run: npm deprecate "@cowwo/dsh-model-fit@${{ inputs.version }}" "${{ inputs.message }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
